services:
  - type: web
    name: kourouma-autopark
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: kourouma-db
          property: connectionString

  - type: cron
    name: rapport-mensuel-bsg
    schedule: "0 7 1 * *"     # Le 1er du mois à 7h
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py rapport_mensuel

databases:
  - name: kourouma-db
    plan: free
