services:
  - type: web
    name: bsg-dashboard
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: bsg-db
          property: connectionString

  - type: cron
    name: rapport-mensuel-bsg
    schedule: "0 7 1 * *"     # Le 1er du mois à 7h
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py rapport_mensuel

databases:
  - name: bsg-db
    plan: free
