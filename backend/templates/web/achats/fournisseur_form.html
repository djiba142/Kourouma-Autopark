{% extends 'web/base.html' %}
{% block title %}Nouveau Fournisseur{% endblock %}
{% block page_title %}Nouveau Fournisseur{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm" style="border-radius:16px">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">
          <i class="bi bi-truck me-2" style="color:#1a3a5c"></i>Créer un fournisseur
        </h5>

        <form method="post" action="{% url 'web:fournisseur_nouveau' %}">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Nom *</label>
            <input type="text" name="nom" class="form-control"
                   placeholder="Ex: Guangzhou Auto Parts Co." required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Pays</label>
              <input type="text" name="pays" class="form-control"
                     placeholder="Ex: Chine" value="Guinée">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Type</label>
              <select name="type" class="form-select">
                {% for val, lbl in types %}
                <option value="{{ val }}">{{ lbl }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Devise par défaut</label>
            <select name="devise_par_defaut" class="form-select">
              {% for val, lbl in devises %}
              <option value="{{ val }}">{{ val }} — {{ lbl }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Téléphone</label>
              <input type="text" name="telephone" class="form-control"
                     placeholder="+86 20 ...">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control"
                     placeholder="contact@fournisseur.com">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Adresse</label>
            <textarea name="adresse" class="form-control" rows="2"
                      placeholder="Adresse complète ou zone industrielle..."></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn fw-bold px-4 py-2"
                    style="background:#1a3a5c;color:#fff;border-radius:10px">
              <i class="bi bi-check-circle me-2"></i>Créer
            </button>
            <a href="{% url 'web:fournisseurs_liste' %}"
               class="btn btn-outline-secondary px-4 py-2" style="border-radius:10px">
              Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
