<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSG — Hors ligne</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; margin: 0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 20px; padding: 3rem; text-align: center;
            max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    .icon { font-size: 4rem; color: #c0392b; margin-bottom: 1rem; }
    h2 { color: #1a3a5c; font-weight: 700; margin-bottom: .5rem; }
    p { color: #6c757d; font-size: 14px; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn { background: #1a3a5c; color: #fff; border: none; padding: 12px 28px;
           border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #2d5a8e; }
    .tips { background: #f8f9fa; border-radius: 12px; padding: 1rem; margin-top: 1rem;
            text-align: left; font-size: 12px; color: #6c757d; }
    .tips li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="bi bi-wifi-off"></i></div>
    <h2>Vous êtes hors ligne</h2>
    <p>
      La connexion internet est interrompue.<br>
      Les pages déjà visitées sont disponibles en cache.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <i class="bi bi-arrow-clockwise me-2"></i>Réessayer
    </button>
    <div class="tips">
      <strong>Pages disponibles hors ligne :</strong>
      <ul class="mt-2 mb-0">
        <li>Dashboard</li>
        <li>Liste des commandes</li>
        <li>Inventaire stock</li>
        <li>Liste des clients</li>
      </ul>
    </div>
  </div>
</body>
</html>
