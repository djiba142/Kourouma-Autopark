{% extends 'web/base.html' %}
{% block title %}Nouveau Client{% endblock %}
{% block page_title %}Nouveau Client{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm" style="border-radius:12px">
      <div class="card-body p-4">

        <form method="post" action="{% url 'web:client_nouveau' %}">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-bold" style="font-size:13px">Nom complet *</label>
            <input type="text" name="nom" class="form-control" required placeholder="Ex: Mamadou Diallo">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" style="font-size:13px">Téléphone *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-phone"></i></span>
              <input type="tel" name="telephone" class="form-control" required placeholder="Ex: 622123456">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" style="font-size:13px">Email (optionnel)</label>
            <input type="email" name="email" class="form-control" placeholder="email@exemple.com">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" style="font-size:13px">Adresse (optionnel)</label>
            <textarea name="adresse" class="form-control" rows="2" placeholder="Quartier, ville..."></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold" style="font-size:13px">Limite de crédit (GNF)</label>
            <input type="number" name="limite_credit" class="form-control" value="0" min="0"
                   placeholder="0 = pas de crédit">
            <div class="form-text">Montant maximum de dette autorisé pour ce client.</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn fw-bold flex-fill"
                    style="background:#1a3a5c;color:#fff;border-radius:10px">
              <i class="bi bi-check-circle me-2"></i>Créer le client
            </button>
            <a href="{% url 'web:clients_liste' %}" class="btn btn-outline-secondary" style="border-radius:10px">
              Annuler
            </a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
