{% extends 'web/base.html' %}
{% block title %}Nouveau Transfert{% endblock %}
{% block page_title %}Nouveau Transfert{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm" style="border-radius:12px">
      <div class="card-body p-4">
        <form method="post" action="{% url 'web:transfert_nouveau' %}">
          {% csrf_token %}

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold" style="font-size:13px">
                <i class="bi bi-geo-alt me-1"></i>Source (provenance) *
              </label>
              <select name="provenance_id" class="form-select" required>
                <option value="">-- Choisir --</option>
                {% for loc in localisations %}
                <option value="{{ loc.pk }}">{{ loc.nom }} ({{ loc.type }})</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold" style="font-size:13px">
                <i class="bi bi-geo-alt-fill me-1"></i>Destination *
              </label>
              <select name="destination_id" class="form-select" required>
                <option value="">-- Choisir --</option>
                {% for loc in localisations %}
                <option value="{{ loc.pk }}">{{ loc.nom }} ({{ loc.type }})</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <h6 class="fw-bold mb-3"><i class="bi bi-box-seam me-2"></i>Produits à transférer</h6>

          <div id="lignes-transfert">
            <div class="row g-2 mb-2 align-items-end ligne-item">
              <div class="col-md-7">
                <select name="produit_id" class="form-select form-select-sm" required>
                  <option value="">-- Produit --</option>
                  {% for p in produits %}
                  <option value="{{ p.pk }}">{{ p.reference }} — {{ p.nom }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-3">
                <input type="number" name="quantite" class="form-control form-control-sm"
                       min="1" value="1" placeholder="Qté" required>
              </div>
              <div class="col-md-2">
                <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="this.closest('.ligne-item').remove()">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>

          <button type="button" class="btn btn-sm btn-outline-secondary mb-4" onclick="ajouterLigne()">
            <i class="bi bi-plus-circle me-1"></i>Ajouter un produit
          </button>

          <hr>
          <div class="d-flex gap-2">
            <button type="submit" class="btn fw-bold flex-fill"
                    style="background:#1a3a5c;color:#fff;border-radius:10px">
              <i class="bi bi-arrow-left-right me-2"></i>Créer le transfert
            </button>
            <a href="{% url 'web:transferts_liste' %}" class="btn btn-outline-secondary" style="border-radius:10px">
              Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function ajouterLigne() {
  const container = document.getElementById('lignes-transfert');
  const first = container.querySelector('.ligne-item');
  const clone = first.cloneNode(true);
  clone.querySelector('select').value = '';
  clone.querySelector('input').value = '1';
  container.appendChild(clone);
}
</script>
{% endblock %}
