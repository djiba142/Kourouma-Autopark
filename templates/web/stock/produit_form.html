{% extends 'web/base.html' %}
{% block title %}Nouveau Produit{% endblock %}
{% block page_title %}Ajouter un Produit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm" style="border-radius:12px;">
            <div class="card-header bg-white py-3 border-0">
                <h6 class="mb-0 fw-bold text-primary"><i class="bi bi-box me-2"></i>Nouveau produit</h6>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Référence</label>
                            <input type="text" name="reference" class="form-control" required placeholder="Ex: REF-001">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Nom</label>
                            <input type="text" name="nom" class="form-control" required placeholder="Nom du produit">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold small">Catégorie</label>
                            <select name="categorie" class="form-select">
                                <option value="">Aucune</option>
                                {% for c in categories %}
                                <option value="{{ c.pk }}">{{ c.nom }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Prix d'achat</label>
                            <input type="number" step="0.01" name="prix_achat" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Prix de vente</label>
                            <input type="number" step="0.01" name="prix_vente" class="form-control" value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Seuil d'alerte (Stock)</label>
                            <input type="number" name="seuil_alerte" class="form-control" value="5">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'web:produits_liste' %}" class="btn btn-light">Annuler</a>
                        <button type="submit" class="btn btn-primary fw-bold">Ajouter le produit <i class="bi bi-check-lg ms-1"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
